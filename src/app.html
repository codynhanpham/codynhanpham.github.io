<!doctype html>
<html lang="%paraglide.lang%" data-theme="default" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/assets/logo/variants/logo-0.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fafaf9" />
		<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />

		<!-- FONTS -->
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/Cherish-Regular.ttf"
			as="font"
			type="font/ttf"
			crossorigin="anonymous"
			fetchpriority="auto"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/NotoSans-VariableFont_wdth,wght.ttf"
			as="font"
			type="font/ttf"
			crossorigin="anonymous"
			fetchpriority="auto"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/NotoSans-Italic-VariableFont_wdth,wght.ttf"
			as="font"
			type="font/ttf"
			crossorigin="anonymous"
			fetchpriority="low"
		/>

		<!-- APPLE THINGS -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; background-color: #1a1a1a; color: white; font-family: system-ui, -apple-system, sans-serif; z-index: 999999; position: fixed; top: 0; left: 0;">
				<div style="text-align: center; padding: 2rem;">
					<h1 style="font-size: 2rem; margin: 0 0 1rem 0;">JavaScript Required</h1>
					<p style="font-size: 1rem; margin: 0; opacity: 0.8;">This page requires JavaScript to function properly. Please enable JavaScript in your browser settings and reload the page.</p>
				</div>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
